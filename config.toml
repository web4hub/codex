# config.toml (Repository Root Defaults)

[build]
# Determines if the native update manager service should be bundled
package_with_updater = true

[runtime]
# Controls preferred rendering layer on Wayland sessions
# Options: "auto", "wayland-gpu", "x11"
rendering_mode = "auto"
force_device_scale_factor = 1.0

[features]
# Controls opt-in experimental Linux capabilities
read_aloud = false
open_target_discovery = false
computer_use_ui = false
