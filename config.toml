[workflow]
mode = "incremental"
subagents_required = true
runtime_config_path = "~/.config/codex-update-manager/config.toml"

[commits]
required = true
policy = "commit_after_each_milestone"
convention = "conventional_commits"

[agents.worker]
role = "implementation owner"

[agents.tester]
role = "automated test owner"

[agents.qa]
role = "manual flow verification"

[agents.validator]
role = "final gate for packaging, privileges, and release readiness"

[package]
name = "clippy"
version = "0.0.212"
description = "A bunch of helpful lints to avoid common pitfalls in Rust"
repository = "https://github.com/rust-lang/rust-clippy"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["clippy", "lint", "plugin"]
categories = ["development-tools", "development-tools::cargo-plugins"]
